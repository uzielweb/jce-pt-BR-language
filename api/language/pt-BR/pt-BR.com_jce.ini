WF_PARAM_DIRECTORY="Caminho do diretório de arquivos"
WF_PARAM_DIRECTORY_DESC="<p>Caminho relativo para o diretório do arquivo. Se deixado em branco, o primeiro valor configurado é usado (ou <em>images</em> se nenhum estiver definido).<br/>Os caminhos são relativos à raiz do site e devem começar com uma pasta estática existente (por exemplo, imagens/$nome de usuário, não $nome de usuário/…).<br/>Se um rótulo não for definido, o último segmento do caminho será usado como rótulo, por exemplo: imagens/arquivos&nbsp;→ Arquivos<br/>As entradas podem ser <strong>reordenadas arrastando &amp; drop</strong>; a entrada <strong>first</strong> é usada como padrão e em contextos de caminho único.<br/>Este caminho pode conter as variáveis:</p><ul><li>$id - ID do usuário</li><li>$username - usuário username</li><li>$usertype ou $usergroup - grupo de usuários, por exemplo <em>author</em></li><li>$profile ou $group - nome do perfil do editor</li><li>$context - opção de componente, por exemplo com_content</li><li>$year - ano atual, por ex. 2025</li><li>$mês - número do mês atual, por exemplo. 09</li><li>$day - número do dia atual, por exemplo. 10</li><li>$hour - hora atual (24 horas), por exemplo. 23</li></ul><p>Veja o guia completo: <a href='https://www.joomlacontenteditor.net/support/tutorials/editor/setting-the-file-directory-path' target='_blank' rel='noopener'>Definindo o caminho do diretório de arquivos</a></p>"
WF_PARAM_DIRECTORY_PATH="Caminho"
WF_PARAM_DIRECTORY_LABEL="Rótulo"

WF_PARAM_DIRECTORY_FILTER="Filtro de diretório"
WF_PARAM_DIRECTORY_FILTER_DESC="Remova o acesso às seguintes pastas no caminho do diretório de arquivos. Como alternativa, adicione um sinal + na frente do nome da pasta para permitir acesso apenas a esta pasta.<br />Exemplo: arquivos removerão o acesso à pasta de arquivos e +arquivos permitirão acesso <strong>only</strong> à pasta de arquivos. Os nomes das pastas são relativos ao caminho do diretório de arquivos configurado (padrão: imagens). <strong>Nota:</strong> Este não é um recurso de segurança e não deve ser usado como tal."
WF_PARAM_ALLOW_ROOT="Permitir acesso root"
WF_PARAM_ALLOW_ROOT_DESC="Permitir acesso ao diretório raiz do sistema de arquivos. Definir esta opção como Sim irá ignorar qualquer valor definido no Caminho do diretório de arquivos. <strong>Isso não é recomendado por motivos de segurança.</strong> Se definido como Não e se o valor do Caminho do diretório de arquivos estiver em branco, o Caminho do diretório de arquivos será padronizado como imagens."
WF_PARAM_DIRECTORY_RESTRICTED="Diretórios restritos"
