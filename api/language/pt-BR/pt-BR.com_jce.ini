WF_PARAM_USE_COOKIES="Usar Cookies"
WF_PARAM_USE_COOKIES_DESC="Permitir cookies para armazenar estados de funções, ex: editor ligado / desligado e diretório atual de plugins. O padrão é Sim."
WF_PARAM_EDITOR_TOOLBAR_ALIGN="Alinhamento da barra de ferramentas"
WF_PARAM_EDITOR_TOOLBAR_ALIGN_DESC="Alinhamento dos botões da barra de ferramentas"
WF_PARAM_EDITOR_TOOLBAR_LOCATION="Localização da barra de ferramentas"
