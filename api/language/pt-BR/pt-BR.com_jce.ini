WF_PARAM_COMPRESS_CACHE_VALIDATION="Forçar Validação de Cache"
WF_PARAM_COMPRESS_CACHE_VALIDATION_DESC="Conteúdo gerado dinamicamente - como esses arquivos compactados - não é armazenado em cache automaticamente pelo navegador. A Validação Forçada de Cache cria um mecanismo pelo qual o navegador pode identificar se o conteúdo foi alterado e, portanto, se deve ser armazenado em cache ou se uma versão em cache existente deve ser usada."

