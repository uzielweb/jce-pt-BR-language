WF_PARAM_EDITOR_ACTIVE_TAB_CODE="Código"
WF_PARAM_EDITOR_ACTIVE_TAB_PREVIEW="Visualização"

WF_PARAM_EDITOR_CONVERT_URLS="Conversão de URL"
WF_PARAM_EDITOR_CONVERT_URLS_DESC="Selecione o método usado para converter URLs específicos do site em conteúdo.<ul><li>Relativo - o protocolo e o domínio do site são removidos do URL</li><li>Absoluto: o protocolo e o domínio do site são adicionados ao URL</li><li>Nenhum: o URL é deixado como está</li></ul>"

WF_PARAM_EDITOR_XTD_BUTTONS="Mostrar botões do Editor-xtd"
WF_PARAM_EDITOR_XTD_BUTTONS_DESC="Mostre os botões do plugin Joomla Editor-xtd abaixo do editor."

;#################### Parameters - Config Cleanup ################################
WF_PARAM_CLEANUP="Validar HTML"
WF_PARAM_CLEANUP_DESC="Defina como Sim (recomendado) para formatar e limpar o conteúdo com base no Doctype selecionado abaixo."
WF_PARAM_SANITIZE_HTML="Sanitizar HTML (Sanitize HTML)"
WF_PARAM_SANITIZE_HTML_DESC="Defina como Sim (recomendado) para usar DOMPurify para remover elementos não seguros, atributos e URLs arriscadas para evitar ataques XSS (Cross-Site Scripting). Opera de forma independente da Validação de HTML."
WF_PARAM_EDITOR_PROFILE_CLEANUP_DESC="Defina como Sim (recomendado) para formatar e limpar o conteúdo com base no tipo de documento selecionado abaixo. Se Herdar for selecionado, as configurações globais para este parâmetro serão usadas."
WF_PARAM_EDITOR_PROFILE_SANITIZE_HTML_DESC="Defina como Sim (recomendado) para usar DOMPurify para remover elementos inseguros, atributos e URLs arriscados para evitar ataques XSS (Cross-Site Scripting). Isso opera independentemente da validação HTML. Se Herdar for selecionado, as configurações globais para este parâmetro serão usadas."
WF_PARAM_PLUGIN_MODE="Modo Plug-in"
WF_PARAM_PLUGIN_MODE_DESC="Se for verdade, & e ' não são codificados quando o conteúdo é salvo para compensar o Joomla! de terceiros mal projetado! plug-ins."
WF_PARAM_JAVASCRIPT="Permitir Javascript"
WF_PARAM_JAVASCRIPT_DESC="Permitir código Javascript em blocos de código e no editor de código. Isso inclui javascript em tags &lt;script&gt;, atributos de eventos e outros valores de atributos."
WF_PARAM_CSS="Permitir CSS"
WF_PARAM_CSS_DESC="Permitir código CSS em tags &lt;style&gt; em blocos de código e no editor de código."
WF_PARAM_ELEMENTS="Elementos Estendidos"
WF_PARAM_ELEMENTS_DESC="Estenda a funcionalidade adicionando elementos extras aqui, no formulário element[attribute1&#124;attribute2]. Os elementos adicionados aqui serão removidos da lista de Elementos Proibidos.<br /><strong>Aplica-se apenas se 'Limpar HTML' for 'Sim'</strong>"
WF_PARAM_NO_ELEMENTS="Elementos Proibidos"
WF_PARAM_NO_ELEMENTS_DESC="Lista de elementos proibidos. Por motivos de segurança, os seguintes elementos serão sempre removidos, a menos que um plug-in ou configuração apropriado seja instalado ou ativado - applet, iframe, objeto, incorporar, script, estilo, corpo, bgsound, base, basefont, quadro, conjunto de quadros, cabeçalho, html, id, ilayer, camada, link, meta, nome, título, xml<br /><strong>Aplica-se apenas se 'Limpeza de HTML' for 'Sim'</strong>"
WF_PARAM_INVALID_ATTRIBUTES="Atributos Proibidos"
WF_PARAM_INVALID_ATTRIBUTES_DESC="Lista de atributos proibidos, por exemplo: dynsrc,lowsrc. Pode aceitar valores de expressão regular, por exemplo: on([a-z]+) removerá todos os atributos do evento (onclick, onmouseover etc.)<br /><strong>Aplica-se apenas se 'Limpar HTML' for 'Sim'</strong>"
WF_PARAM_INVALID_ATTRIBUTE_VALUES="Valores de atributos proibidos"
WF_PARAM_INVALID_ATTRIBUTE_VALUES_DESC="Lista de valores de atributos proibidos no formato Seletor de atributos CSS, por exemplo: img[title='test'] removerá o valor do atributo title de todas as tags img com o valor 'test'.<br />Aceita os seletores de atributos CSS 2.1 e CSS 3 - <ul><li>O atributo começa com valor: tag[name^='value']<br />eg: img[src='data:image'] removerá todos os caminhos codificados em base64 de img src atributos</li><li>Attribute equals value : tag[name='value']</li><li>Attribute is not equal to value : name!='value'</li><li>Attribute termina com value : tag[name$='value']<br />eg: img[src$='.jpg'] removerá todos os valores img src que contêm caminhos com a extensão .jpg</li></ul><br /><strong>Aplica-se apenas se 'Limpar HTML' for 'Sim'</strong>"
WF_PARAM_PHP="Permitir PHP"
WF_PARAM_PHP_DESC="Permitir código PHP em blocos de código e no editor de código. O suporte completo pode exigir a instalação de conteúdo front-end adicional ou plug-in de sistema."
WF_PARAM_ENTITY_ENCODING="Codificação de Entidades"
WF_PARAM_ENTITY_ENCODING_DESC="Método de codificação de entidades a ser usado pelo editor."
WF_PARAM_PROTECT_SHORTCODE="Proteger código curto"
WF_PARAM_PROTECT_SHORTCODE_DESC="EXPERIMENTAL - Proteja o conteúdo das tags shortcode, por exemplo: {tag}content{/tag} do processamento pelo editor"
WF_PARAM_ALLOW_CUSTOM_XML="Permitir XML personalizado"
WF_PARAM_ALLOW_CUSTOM_XML_DESC="Permitir a edição de código XML personalizado em Code Blocks e no Code Editor."

WF_PARAM_CODE_BLOCKS="Blocos de código"
WF_PARAM_CODE_BLOCKS_DESC_WARNING="<strong>Atenção:</strong> A ativação de qualquer uma dessas opções permitirá que os usuários do editor criem conteúdo e efetuem alterações no site - direta ou indiretamente - que podem representar um risco de segurança para o site e seus visitantes. Portanto, essas opções só devem ser habilitadas em perfis atribuídos a usuários e grupos de usuários confiáveis."

WF_PARAM_CODE_BLOCKS_ENABLE="Habilitar blocos de código"
WF_PARAM_CODE_BLOCKS_ENABLE_DESC="Exiba scripts e códigos em blocos de código visíveis e editáveis ​​no editor. Se desativado, serão utilizados placeholders para indicar a presença de scripts no conteúdo, que deverá então ser editado no Editor de Códigos."

WF_PARAM_EDITOR_STYLE_RESET="Modo de Alto Contraste"
WF_PARAM_EDITOR_STYLE_RESET_DESC="Força um estilo de alto contraste do conteúdo do editor com texto preto alinhado à esquerda em um fundo branco. Defina como Automático para detectar se isso é necessário com base no contraste da cor de fundo e da cor do texto."

WF_PARAM_PAD_EMPTY_TAGS="Preencher Tags Vazias"
WF_PARAM_PAD_EMPTY_TAGS_DESC="Por padrão, algumas tags vazias (p, h1-6, pre, div, address, caption) são preenchidas com um espaço não separável para que mantenham sua estrutura quando renderizadas pelo navegador. Sem o espaço, alguns navegadores não renderizariam as tags corretamente, a menos que CSS adicional seja usado.<br />Defina esta opção como Não para remover o espaço não separável quando o editor for alternado ou o conteúdo for salvo."

WF_PARAM_VALIDATE_STYLES="Validar estilos"
WF_PARAM_VALIDATE_STYLES_DESC="Permitir apenas uma sintaxe CSS válida para o valor do atributo de estilo em todos os elementos."

WF_PARAM_ALLOW_EVENT_ATTRIBUTES="Permitir atributos de evento"
WF_PARAM_ALLOW_EVENT_ATTRIBUTES_DESC="Permitir atributos de evento, por exemplo: onclick, onload etc. em todos os elementos. Como os atributos de evento são capazes de executar código javascript, eles só devem ser permitidos para usuários confiáveis."

;#################### Parameters - Config General ################################
WF_PARAM_CUSTOM_COLORS="Cores personalizadas"
WF_PARAM_CUSTOM_COLORS_DESC="Uma lista separada por vírgulas de cores a serem usadas pelo ColourPicker, em formato Hex, por exemplo: #ff0000."
WF_PARAM_CUSTOM_CONFIG="Variáveis de Configuração Personalizadas"
WF_PARAM_CUSTOM_CONFIG_DESC="Especifique valores opcionais para definir ou substituir opções de configuração do editor."
WF_PARAM_FONTS="Fontes"
WF_PARAM_FONTS_NEW="Adicionar nova fonte..."
WF_PARAM_FONTS_DESC="Fontes para incluir na lista Font Famliy.<br />Desmarque uma fonte para removê-la da lista, adicione uma nova fonte clicando no botão 'Adicionar nova fonte'. Arraste para reordenar as fontes."
WF_PARAM_FONT_SIZES="Tamanhos de fonte"
WF_PARAM_FONT_SIZES_DESC="Lista separada por vírgulas de valores de tamanho de fonte, por exemplo: 8pt,10pt,12pt,14pt,18pt,24pt,36pt"
WF_PARAM_BLOCK_FORMAT="Elementos de formato"
WF_PARAM_BLOCK_FORMAT_DESC="Elementos de bloco para a lista de seleção de formato.</br />Desmarque para remover o item da lista. Arraste para reordenar."
WF_BLOCK_FORMAT_PREVIEW_STYLES="Mostrar visualização do formato"
WF_BLOCK_FORMAT_PREVIEW_STYLES_DESC="Mostre uma visualização com estilo simples de cada item de formato na lista usando os estilos de modelo de site."
WF_PARAM_DOCTYPE="Doctype"
WF_PARAM_DOCTYPE_DESC="Doctype para validar o HTML (se Validar HTML estiver definido como Sim)<ul><li>HTML4 : Validar usando a especificação HTML4 Transitional</li><li>HTML5 : Validar usando a especificação HTML5</li><li>Misto : Validar usando uma combinação das especificações HTML4 e HTML5</li></ul>"
WF_PARAM_DOCTYPE_MIXED="Misto"
WF_PARAM_EDITOR_PROFILE_DOCTYPE_DESC="Tipo de documento para validar HTML com (se Validar HTML estiver definido como Sim)<ul><li>HTML4: validar usando a especificação transitória HTML4</li><li>HTML5: validar usando a especificação HTML5</li><li>Mixed: validar usando uma combinação da especificação HTML4 e HTML5</li><li>Inherit: usar o Tipo de documento definido na configuração global</li></ul>"
WF_PARAM_INLINE_UPLOAD="Upload embutido"
WF_PARAM_INLINE_UPLOAD_DESC="Permitir arrastar e soltar e upload de espaço reservado para este plugin na área de conteúdo do editor."

;## Object Resizing ##
WF_PARAM_OBJECT_RESIZING="Redimensionamento de objetos"
WF_PARAM_OBJECT_RESIZING_DESC="Permitir que objetos de mídia - imagens, vídeos, tabelas - sejam redimensionados por arraste na janela do editor"

;#################### Parameters - Config Plugins ################################
WF_PARAM_FOLDER_TREE="Árvore de pastas"
WF_PARAM_FOLDER_TREE_DESC="Use a árvore de pastas para navegação de diretório em plug-ins 'Gerenciador'"
WF_PARAM_UPLOAD_EXISTS="Carregar ação de conflito"
WF_PARAM_UPLOAD_EXISTS_DESC="Selecione a ação para lidar com conflitos de upload (onde um arquivo com o mesmo nome do arquivo enviado já existe na pasta de destino)"
WF_PARAM_UPLOAD_EXISTS_OVERWRITE="Substituir arquivo existente"
WF_PARAM_UPLOAD_EXISTS_UNIQUE="Crie um nome de arquivo exclusivo para o arquivo enviado"
WF_PARAM_UPLOAD_SUFFIX="Sufixo do nome do arquivo"
WF_PARAM_UPLOAD_SUFFIX_DESC="Um sufixo a ser adicionado a um arquivo carregado ou colado se o arquivo já existir. O valor padrão é '_copy'. Adicione $ ao sufixo para adicionar um incremento numérico, por exemplo: _$, resultará _1, _2 etc."
WF_PARAM_UPLOAD_ADD_RANDOM="Nome do arquivo de upload aleatório"
WF_PARAM_UPLOAD_ADD_RANDOM_DESC="Anexe uma string aleatória ao nome dos arquivos enviados para maior segurança. <strong>Append</strong> adiciona uma string aleatória de 16 caracteres ao nome do arquivo. <strong>Full</strong> substitui o nome do arquivo inteiramente por uma string aleatória de 16 caracteres, mantendo a extensão do arquivo."
WF_OPTION_UPLOAD_ADD_RANDOM_FULL="Completo"
WF_OPTION_UPLOAD_ADD_RANDOM_APPEND="Acrescentar"
WF_PARAM_UPLOAD_REMOVE_EXIF="Remover dados EXIF ​​da imagem"
WF_PARAM_UPLOAD_REMOVE_EXIF_DESC="Remova os dados da imagem <a href='https://en.wikipedia.org/wiki/Exchangeable_image_file_format' title='EXIF'>EXIF</a> dos arquivos JPEG e PNG enviados"
WF_PARAM_UPLOAD_QUALITY="Qualidade de upload (%)"
WF_PARAM_UPLOAD_QUALITY_DESC="Qualidade JPEG padrão para imagens enviadas"
WF_PARAM_WEBSAFE_MODE="Nomes de arquivos seguros para Web"
WF_PARAM_WEBSAFE_MODE_DESC="Formato a ser usado ao criar nomes de arquivos e pastas seguros para a Web. UTF-8 permitirá caracteres UTF-8 completos e A-Za-z0-9._-~ no nome, ASCII converterá alguns caracteres latinos UTF-8 em equivalentes ASCII, por exemplo: ë -> e, õ -> o etc."
WF_PARAM_WEBSAFE_ALLOW_SPACES="Permitir espaços em nomes de arquivos/pastas"
WF_PARAM_WEBSAFE_ALLOW_SPACES_DESC="Defina como Sim para permitir espaços em nomes de arquivos e pastas ou selecione um caractere para usar como substituto do espaço."
WF_PARAM_WEBSAFE_TEXTCASE="Caso de texto"
WF_PARAM_WEBSAFE_TEXTCASE_DESC="Selecione a caixa de texto a ser usada para nomes de arquivos/pastas."
WF_PARAM_DATE_FORMAT="Formato de data"
WF_PARAM_DATE_FORMAT_DESC="Formato de data a ser usado ao exibir a data de modificação de arquivos e pastas, por exemplo: %d/%m/%Y, %H:%M será exibido como 13/12/1984, 14:00"
WF_PARAM_VALIDATE_MIMETYPE="Validar tipo MIME"
WF_PARAM_VALIDATE_MIMETYPE_DESC="Para segurança adicional ao fazer upload, verifique o tipo MIME do arquivo enviado em relação à sua extensão. Se habilitado e o servidor não suportar as funções PHP fileinfo ou mime_content_type, a verificação do tipo mime será ignorada."
WF_PARAM_BROWSER_POSITION="Posição do navegador de arquivos"
WF_PARAM_BROWSER_POSITION_DESC="Posição do navegador de arquivos na caixa de diálogo. O padrão é inferior"
WF_PARAM_LIST_LIMIT="Tamanho da lista do navegador de arquivos"
WF_PARAM_LIST_LIMIT_DESC="Número de arquivos/pastas a serem exibidos na lista de arquivos/pastas do Navegador de Arquivos"
WF_PARAM_EXTENSIONS="Extensões de arquivo permitidas"
WF_PARAM_EXTENSIONS_DESC="Lista de extensões de arquivo permitidas para upload e exibição, organizadas por tipo. Para editar a lista, clique no ícone de lápis. Você pode mover extensões entre grupos arrastando e soltando. As extensões podem ser desativadas desmarcando a caixa de seleção correspondente. Para adicionar uma extensão personalizada, use o campo de entrada na parte inferior da lista. Clique no ícone de adição para adicionar um novo campo de entrada ou no ícone da lixeira para remover um existente."
WF_PARAM_BUTTONS="Botões"
WF_PARAM_BUTTONS_DESC="Selecione os botões a serem exibidos na barra de ferramentas do editor"
WF_PARAM_KEEP_NBSP="Manter espaços não separáveis (non-breaking spaces)"
WF_PARAM_KEEP_NBSP_DESC="Quando a Codificação de Entidades estiver definida como UTF-8, converte espaços UTF-8 em espaços não separáveis (&amp;nbsp;) (recomendado)"

WF_PARAM_TOTAL_FILES_LIMIT="Limite total de arquivos"
WF_PARAM_TOTAL_FILES_LIMIT_DESC="Defina um limite para o número total de arquivos que o caminho do diretório de arquivos pode conter (incluindo todas as subpastas), por exemplo: 50. Os uploads serão restritos quando esse limite for atingido. Deixe em branco para não ter limite."
WF_PARAM_TOTAL_FILES_SIZE_LIMIT="Limite total de tamanho de arquivo"
WF_PARAM_TOTAL_FILES_SIZE_LIMIT_DESC="Defina um limite para o tamanho total que o caminho do diretório de arquivos pode ter, em Mb, por exemplo: 10. Os uploads serão restritos quando esse limite for atingido. Deixe em branco para não ter limite."

WF_BROWSER_ALLOW_DOWNLOAD="Permitir download de arquivo"
WF_BROWSER_ALLOW_DOWNLOAD_DESC="Permita o download direto dos arquivos listados no Navegador de Arquivos pressionando a tecla ALT enquanto clica no nome do arquivo."

WF_PARAM_CUSTOM_ATTRIBUTES="Atributos personalizados"
WF_PARAM_CUSTOM_ATTRIBUTES_DESC="Valores padrão para atributos customizados. Defina o nome do atributo e o valor padrão. Marque a opção <strong>Boolean</strong> para definir isso como um atributo booleano."
WF_PARAM_CUSTOM_ATTRIBUTES_NAME="Nome do Atributo"
WF_PARAM_CUSTOM_ATTRIBUTES_VALUE="Valor do Atributo"

