WF_FORECOLOR_DESC="Alterar a cor do texto selecionado"
WF_FORECOLOR_LIST_TITLE="Cores de texto personalizadas"
WF_FORECOLOR_LIST_DESC="Uma lista separada por vírgulas de cores personalizadas, em formato hexadecimal, para exibir no menu suspenso Cor do texto, por exemplo: #000000,#444444,#888888"
WF_FORMATSELECT_TITLE="Seleção de formato"
WF_FORMATSELECT_DESC="Aplicar um formato de bloco ao texto ou elemento selecionado, por exemplo: Parágrafo envolverá o texto selecionado em um elemento de parágrafo"
WF_JUSTIFYFULL_TITLE="Justificar completo"
WF_JUSTIFYFULL_DESC="Formate o texto selecionado para preencher toda a largura do elemento contêiner"
WF_FULLSCREEN_TITLE="Tela inteira"
