WF_DIRECTIONALITY_TITLE="Direcionalidade"
WF_DIRECTIONALITY_DESC="Defina a direcionalidade de um elemento (por exemplo: da esquerda para a direita ou da direita para a esquerda)"
WF_FONTSELECT_TITLE="Seleção de família de fontes"
