WF_PARAM_EDITOR_GLOBAL_CSS_DESC="Arquivo CSS a ser usado para o estilo do conteúdo do editor e opções da lista de Estilos.<br />Arquivo CSS do Modelo - Use o arquivo CSS padrão (template.css ou template_css.css) do seu modelo do Joomla!<br />Arquivo CSS Personalizado - Use um arquivo CSS personalizado especificado no campo Arquivo CSS Personalizado<br />Padrão - Usar estilos padrão do Editor JCE"
WF_PARAM_EDITOR_PROFILE_CSS_DESC="Especifique como integrar os arquivos CSS personalizados e os estilos personalizados com os estilos do editor definidos na configuração global do editor.<ul><li>Add - Adicione os <strong>Arquivos CSS personalizados</strong> aos estilos do editor. Adicione <strong>Custom Styles</strong> à lista de estilos.</li><li>Overwrite - Substitua os estilos do editor pelos <strong>Custom CSS Files</strong> e <strong>Custom Styles</strong>.</li><li>Inherit - Use apenas os estilos de editor definidos na configuração global do editor (Padrão)</li></ul>"
WF_PARAM_CSS_TEMPLATE="Arquivo CSS do Modelo"
WF_PARAM_CSS_CUSTOM="Arquivos CSS Personalizados"
WF_PARAM_CSS_CUSTOM_DESC="Use um arquivo CSS personalizado para estilizar o conteúdo do editor e como fonte para classes na lista Estilos se Estilos do Editor estiver definido como Arquivos CSS Personalizados.<br />Insira o URL relativo do arquivo CSS de substituição.<br />A variável $template será substituída pelo nome do seu modelo ativo.<br />Separe várias folhas de estilo com vírgula, ex: templates/$template/css/sheet1.css, templates/$template/css/sheet2.css<br />Limpe o cache do seu navegador após alterar a configuração de Estilos do Editor."
