WF_PARAM_EDITOR_PROFILE_ROOT_BLOCK_DESC="Selecione o elemento do contêiner e o comportamento da tecla Enter: <ul><li><strong>Paragraph Container e parágrafo em Enter</strong><br />Todos os elementos de texto e não-bloco serão agrupados em um parágrafo e pressionar a tecla Enter criará um novo parágrafo. SHIFT + Enter cria uma quebra de linha.</li><li><strong>Div Container & Div em Enter</strong><br />Todos os elementos de texto e não-bloco serão agrupados em um DIV e pressionar a tecla Enter criará um novo DIV. SHIFT + Enter cria uma quebra de linha.</li><li><strong>Nenhum contêiner e parágrafo em Enter</strong><br />Texto e elementos sem bloco não serão quebrados. Pressionar a tecla Enter criará um novo parágrafo. SHIFT + Enter cria uma quebra de linha.</li><li><strong>Nenhum contêiner e quebra de linha em Enter</strong><br />Texto e elementos sem bloco não serão quebrados. Pressionar a tecla Enter criará uma quebra de linha. SHIFT + Enter cria um parágrafo.</li><li><strong>Herdar (padrão)</strong><br />Usar configurações globais.</ul>"
