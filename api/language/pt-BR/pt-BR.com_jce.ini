WF_PARAM_EDITOR_RESIZE_COOKIE="Tamanho do editor de loja"
WF_PARAM_EDITOR_RESIZE_COOKIE_DESC="Armazene o tamanho redimensionado do Editor usando um cookie"
WF_PARAM_EDITOR_BODY_CLASS="Classe do Editor (Body Class)"
WF_PARAM_EDITOR_BODY_CLASS_DESC="Um nome de classe ou lista de classes (separadas por espaço) a serem aplicadas à área de conteúdo do editor. ex: content-area"

WF_PARAM_EDITOR_WORDCOUNT="Contagem de palavras"
WF_PARAM_EDITOR_WORDCOUNT_DESC="Mostrar uma contagem de palavras na barra de status do editor"

WF_PARAM_EDITOR_ACTIVE_TAB="Guia Ativa"
WF_PARAM_EDITOR_ACTIVE_TAB_DESC="Selecione a guia do editor padrão para exibir"
