WF_HR_TITLE="Regra horizontal"
WF_HR_DESC="Insira uma regra horizontal"
WF_IMGMANAGER_TITLE="Gerenciador de imagens"
WF_IMGMANAGER_DESC="Carregar, excluir, renomear e inserir imagens"
WF_INDENT_TITLE="Recuar"
WF_INDENT_DESC="Recuar o texto ou elemento selecionado"
